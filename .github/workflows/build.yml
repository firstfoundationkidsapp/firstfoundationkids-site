name: Build Android app
on:
  push:
    branches: [android-app]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
      - name: SDK packages
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0" > /dev/null
      - name: Build unsigned bundle
        run: chmod +x gradlew && ./gradlew --no-daemon bundleRelease
      - name: Publish build
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          TAG="android-build-${{ github.run_number }}"
          cp app/build/outputs/bundle/release/app-release.aab app-release-unsigned.aab
          gh release create "$TAG" app-release-unsigned.aab --target "${{ github.sha }}" --prerelease \
            --title "Android build ${{ github.run_number }} (unsigned)" --notes "Unsigned build, signed offline with the upload key."
